<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica de Estética</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="dados.js"></script>
<style>
:root{
  --c:#9b4d64;            /* sobrescrita por dados.js */
  --c-soft:#f5e9ed;
  --ink:#2a2125; --muted:#6f6266; --line:#ece4e6;
  --bg:#fffdfc; --bg-2:#faf5f3;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:clamp(2rem,4vw,2.8rem)}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:600;text-decoration:none;border:1.5px solid var(--c);transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-main{background:var(--c);color:#fff}
.btn-line{color:var(--c);background:transparent}
.btn svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--c);outline-offset:3px}

/* faixa de prévia */
.previa{background:var(--ink);color:#fff;font-size:.82rem;text-align:center;padding:8px 16px}
.previa b{font-weight:600}

/* topo */
.top{position:sticky;top:0;z-index:10;background:rgba(255,253,252,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{font-family:var(--serif);font-size:1.5rem;font-weight:600;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:26px;font-size:.92rem}
.nav a{text-decoration:none;color:var(--muted)}
.nav a:hover{color:var(--ink)}
.top .btn{padding:10px 18px;font-size:.9rem}
@media (max-width:820px){.nav{display:none}}

/* hero */
.hero{padding:64px 0 72px;background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.6rem,6vw,4.4rem);margin:14px 0 18px}
.hero h1 em{font-style:italic;color:var(--c)}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:34em}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.rating{display:inline-flex;align-items:center;gap:10px;margin-top:28px;font-size:.92rem;color:var(--muted)}
.stars{color:#d29a2b;letter-spacing:2px}
.rating b{color:var(--ink)}
.visual{position:relative;aspect-ratio:4/5;border-radius:220px 220px var(--r) var(--r);overflow:hidden;background:var(--c-soft);max-width:460px;justify-self:end;width:100%}
.visual img{width:100%;height:100%;object-fit:cover}
.visual .ph{position:absolute;inset:0;display:grid;place-items:center}
.visual .ph span{font-family:var(--serif);font-size:7rem;color:var(--c);opacity:.35;font-style:italic}
.visual .tag{position:absolute;left:18px;bottom:18px;right:18px;background:rgba(255,255,255,.92);border-radius:14px;padding:12px 16px;font-size:.85rem;display:flex;justify-content:space-between;gap:10px}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:36px}.visual{justify-self:center;max-width:380px}}

section.block{padding:88px 0}
.head{max-width:620px;margin-bottom:44px}
.head p{color:var(--muted);margin-top:12px}

/* procedimentos */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--r);padding:26px;background:#fff;display:flex;flex-direction:column;gap:10px}
.card .n{font-family:var(--serif);font-size:1rem;color:var(--c);font-style:italic}
.card h3{font-size:1.55rem}
.card p{color:var(--muted);font-size:.95rem}
.card a{margin-top:auto;padding-top:8px;font-weight:600;font-size:.9rem;color:var(--c);text-decoration:none}

/* sobre */
.about{background:var(--bg-2)}
.about .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.about .pic{aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--c-soft);display:grid;place-items:center}
.about .pic img{width:100%;height:100%;object-fit:cover}
.about .pic span{font-family:var(--serif);font-size:5rem;color:var(--c);opacity:.35;font-style:italic}
.about p{color:var(--muted);margin-top:16px}
.resp{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:.92rem}
.resp b{display:block;color:var(--ink)}
.difs{display:grid;gap:14px;margin-top:28px}
.dif{display:flex;gap:14px}
.dif i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c-soft);color:var(--c);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.85rem}
.dif b{display:block}
.dif span{color:var(--muted);font-size:.93rem}
@media (max-width:860px){.about .wrap{grid-template-columns:1fr;gap:32px}.about .pic{max-width:420px}}

/* passos */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}
.step{padding:26px;border-radius:var(--r);background:var(--c-soft)}
.step::before{counter-increment:s;content:counter(s);font-family:var(--serif);font-size:2.4rem;color:var(--c);display:block;line-height:1;margin-bottom:10px}
.step b{display:block;font-size:1.05rem}
.step span{color:var(--muted);font-size:.93rem}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* faq */
.faq{max-width:760px}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::after{content:"+";color:var(--c);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--muted);margin-top:10px}

/* local */
.local .wrap{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:stretch}
.info{display:flex;flex-direction:column;gap:20px}
.info h4{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.map{border-radius:var(--r);overflow:hidden;min-height:340px;border:1px solid var(--line);background:var(--bg-2)}
.map iframe{width:100%;height:100%;min-height:340px;border:0;display:block}
@media (max-width:860px){.local .wrap{grid-template-columns:1fr}}

/* cta final + rodapé */
.final{background:var(--c);color:#fff;text-align:center;padding:80px 0}
.final h2{color:#fff}
.final p{opacity:.85;margin:12px auto 28px;max-width:32em}
.final .btn{background:#fff;color:var(--c);border-color:#fff}
footer{padding:36px 0 96px;font-size:.85rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

/* whatsapp flutuante */
.float{position:fixed;right:18px;bottom:18px;z-index:20;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.float svg{width:30px;height:30px;fill:#fff}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var D = window.DADOS || {};
  var e = function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var wa = function(msg){return "https://wa.me/55"+String(D.whatsapp||"").replace(/\D/g,"")+"?text="+encodeURIComponent(msg||("Olá! Vim pelo site e gostaria de agendar uma avaliação na "+D.nome+"."))};
  var waIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3Z"/></svg>';
  var initial = (D.nome||"C").replace(/^(cl[ií]nica|est[eé]tica|espa[cç]o|dra?\.?)\s+/i,"").trim().charAt(0).toUpperCase();

  // cor e metadados
  if (D.corPrimaria){
    document.documentElement.style.setProperty("--c", D.corPrimaria);
    document.documentElement.style.setProperty("--c-soft", D.corPrimaria + "1a");
  }
  document.title = D.nome + (D.cidade ? " | Estética em " + D.cidade : "");
  var md = document.querySelector('meta[name="description"]'); if (md) md.content = D.descricao || "";
  if (D.previa){ var r=document.createElement("meta"); r.name="robots"; r.content="noindex,nofollow"; document.head.appendChild(r); }

  var nomeParts = String(D.nome||"").split(" ");
  var heroTitle = D.slogan ? e(D.slogan) : e(D.nome);
  var procs = D.procedimentos || [];
  var g = D.google || {};
  var mapQ = encodeURIComponent((D.endereco||"") || (D.nome+" "+(D.cidade||"")));

  var html = "";
  if (D.previa) html += '<div class="previa"><b>Prévia de demonstração</b> criada por '+e(D.autorPrevia)+' para '+e(D.nome)+'. Fotos e textos ilustrativos.</div>';

  html += '<header class="top"><div class="wrap"><a class="logo" href="#">'+e(D.nome)+'</a>'+
    '<nav class="nav" aria-label="Seções"><a href="#procedimentos">Procedimentos</a><a href="#sobre">Sobre</a><a href="#duvidas">Dúvidas</a><a href="#contato">Contato</a></nav>'+
    '<a class="btn btn-main" href="'+wa()+'" target="_blank" rel="noopener">Agendar</a></div></header>';

  html += '<section class="hero"><div class="wrap"><div>'+
    '<span class="eyebrow">'+e(D.nome)+(D.bairro?' · '+e(D.bairro):'')+'</span>'+
    '<h1>'+heroTitle+'</h1>'+
    '<p class="lead">'+e(D.descricao)+'</p>'+
    '<div class="ctas"><a class="btn btn-main" href="'+wa()+'" target="_blank" rel="noopener">'+waIcon+'Agendar avaliação</a><a class="btn btn-line" href="#procedimentos">Ver procedimentos</a></div>'+
    (g.nota ? '<div class="rating"><span class="stars" aria-hidden="true">★★★★★</span><span><b>'+e(g.nota)+'</b> no Google · '+e(g.avaliacoes)+' avaliações</span></div>' : '')+
    '</div><div class="visual">'+
    (D.fotos && D.fotos.destaque ? '<img src="'+e(D.fotos.destaque)+'" alt="Ambiente da '+e(D.nome)+'">' : '<div class="ph"><span>'+e(initial)+'</span></div>')+
    (procs.length ? '<div class="tag"><span>'+e(procs.length)+' procedimentos</span><span>'+e(D.cidade||"")+'</span></div>' : '')+
    '</div></div></section>';

  if (procs.length){
    html += '<section class="block" id="procedimentos"><div class="wrap"><div class="head"><span class="eyebrow">Procedimentos</span><h2>Tratamentos para o rosto e o corpo</h2><p>Todos começam com uma avaliação para indicar o protocolo certo para você.</p></div><div class="grid">'+
      procs.map(function(p,i){return '<article class="card"><span class="n">'+String(i+1).padStart(2,"0")+'</span><h3>'+e(p.nome)+'</h3><p>'+e(p.texto)+'</p><a href="'+wa("Olá! Gostaria de saber mais sobre "+p.nome+" na "+D.nome+".")+'" target="_blank" rel="noopener">Quero saber mais →</a></article>'}).join("")+
      '</div></div></section>';
  }

  var s = D.sobre || {};
  html += '<section class="block about" id="sobre"><div class="wrap"><div class="pic">'+
    (D.fotos && D.fotos.sobre ? '<img src="'+e(D.fotos.sobre)+'" alt="Equipe da '+e(D.nome)+'">' : '<span>'+e(initial)+'</span>')+
    '</div><div><span class="eyebrow">Quem somos</span><h2>'+e(s.titulo||"Sobre a clínica")+'</h2><p>'+e(s.texto)+'</p>'+
    ((D.diferenciais||[]).length ? '<div class="difs">'+D.diferenciais.map(function(d){return '<div class="dif"><i>✓</i><div><b>'+e(d.titulo)+'</b><span>'+e(d.texto)+'</span></div></div>'}).join("")+'</div>' : '')+
    (s.responsavel ? '<div class="resp"><b>Responsável técnica: '+e(s.responsavel)+'</b>'+e(s.registro)+'</div>' : '')+
    '</div></div></section>';

  html += '<section class="block"><div class="wrap"><div class="head"><span class="eyebrow">Como agendar</span><h2>Três passos até o seu horário</h2></div><div class="steps">'+
    '<div class="step"><b>Chame no WhatsApp</b><span>Conte qual tratamento te interessa.</span></div>'+
    '<div class="step"><b>Faça a avaliação</b><span>Entendemos sua pele e seus objetivos.</span></div>'+
    '<div class="step"><b>Comece o protocolo</b><span>Sessões no horário que funciona para você.</span></div>'+
    '</div></div></section>';

  if ((D.perguntas||[]).length){
    html += '<section class="block" id="duvidas" style="background:var(--bg-2)"><div class="wrap"><div class="head"><span class="eyebrow">Dúvidas</span><h2>Perguntas frequentes</h2></div><div class="faq">'+
      D.perguntas.map(function(q){return '<details><summary>'+e(q.p)+'</summary><p>'+e(q.r)+'</p></details>'}).join("")+'</div></div></section>';
  }

  html += '<section class="block local" id="contato"><div class="wrap"><div class="info"><div><span class="eyebrow">Onde estamos</span><h2 style="margin-top:8px">Visite a clínica</h2></div>'+
    (D.endereco ? '<div><h4>Endereço</h4><p>'+e(D.endereco)+'</p></div>' : '')+
    ((D.horario||[]).length ? '<div><h4>Horário</h4><p>'+D.horario.map(e).join("<br>")+'</p></div>' : '')+
    '<div><h4>Contato</h4><p>'+e(D.telefoneExibicao)+(D.instagram ? '<br><a href="https://instagram.com/'+e(D.instagram)+'" target="_blank" rel="noopener">@'+e(D.instagram)+'</a>' : '')+'</p></div>'+
    '<div><a class="btn btn-main" href="'+wa()+'" target="_blank" rel="noopener">'+waIcon+'Falar no WhatsApp</a></div></div>'+
    '<div class="map"><iframe title="Mapa" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q='+mapQ+'&z=16&output=embed"></iframe></div></div></section>';

  html += '<section class="final"><div class="wrap"><h2>Agende sua avaliação</h2><p>Fale com a nossa equipe e encontre o tratamento ideal para você.</p><a class="btn" href="'+wa()+'" target="_blank" rel="noopener">'+waIcon+'Agendar pelo WhatsApp</a></div></section>';

  html += '<footer><div class="wrap"><span>© '+new Date().getFullYear()+' '+e(D.nome)+(s.responsavel ? ' · Resp. técnica: '+e(s.responsavel)+' '+e(s.registro) : '')+'</span><span>'+e(D.cidade)+' - PR</span></div></footer>';

  html += '<a class="float" href="'+wa()+'" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">'+waIcon+'</a>';

  document.getElementById("app").innerHTML = html;
})();
</script>
</body>
</html>
